# Version updates arrive monthly, grouped into one PR per ecosystem, and only
# after a release has been public for a week (compromised releases are usually
# pulled within days). Security updates are not delayed by this schedule.
#
# Not covered here, so bump them by hand: the Go toolchain (go.mod and
# mise.toml together), the tool versions in the Makefile and the matching
# `version:` inputs in .github/workflows, and the distroless base image in the
# Dockerfile, which is referenced by a tag without a digest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directories: ["/"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: deps
