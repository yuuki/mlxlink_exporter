# GoReleaser configuration for mlxlink_exporter.
# See https://goreleaser.com/ for documentation.
version: 2
project_name: mlxlink_exporter

release:
  github:
    owner: yuuki
    name: mlxlink_exporter

builds:
  - id: mlxlink_exporter
    main: .
    binary: mlxlink_exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}

archives:
  - id: tgz
    ids:
      - mlxlink_exporter
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - deploy/systemd/mlxlink_exporter-root.conf
      - deploy/systemd/mlxlink_exporter.service

# `dockers_v2` rather than `dockers` + `docker_manifests`: the latter pair is
# deprecated, and it would need one entry per architecture plus a manifest
# stitching them back together to express what `platforms` states directly.
dockers_v2:
  - id: mlxlink_exporter
    ids:
      - mlxlink_exporter
    images:
      - ghcr.io/yuuki/mlxlink_exporter
    tags:
      - "v{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - LICENSE
    # Deliberately not disabled on snapshots: GoReleaser already refuses to push
    # from one, so a snapshot builds the image without publishing it. That makes
    # `--snapshot` the check that a Dockerfile change still works, which is worth
    # more than the minutes it adds to a local run.
    # Labels and annotations carry the same data on purpose: ghcr.io links a
    # package to its repository from the image config label, while the manifest
    # annotations are what a multi-platform aware client reads.
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Prometheus exporter for NVIDIA mlxlink physical link and optical module telemetry"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: "MIT"
    annotations:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Prometheus exporter for NVIDIA mlxlink physical link and optical module telemetry"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: "MIT"

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

changelog:
  sort: desc
  use: git

